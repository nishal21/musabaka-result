# musabaka.nishal.dev — Next.js on :3003 (PM2: musabaka)
# Does not touch portfolio (:3002), handoff (:3010), or nmhelper.
#
#   sudo cp /opt/musabaka/deploy/nginx-musabaka.nishal.dev.conf /etc/nginx/sites-available/musabaka.nishal.dev
#   sudo ln -sf /etc/nginx/sites-available/musabaka.nishal.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d musabaka.nishal.dev

server {
    listen 80;
    listen [::]:80;
    server_name musabaka.nishal.dev;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name musabaka.nishal.dev;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/musabaka.nishal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musabaka.nishal.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
